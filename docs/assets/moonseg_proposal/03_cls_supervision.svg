<text x="42" y="48" font-size="16" font-weight="700" fill="#64748B" text-anchor="start">03</text>
<text x="88" y="49" font-size="27" font-weight="700" fill="#172B4D" text-anchor="start">混合视野与 CLS 辅助监督</text>
<text x="42" y="82" font-size="16" font-weight="400" fill="#64748B" text-anchor="start">每张原图每次只生成一个训练视图；分类标签来自对应 GT</text>
