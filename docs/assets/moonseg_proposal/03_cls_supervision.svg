<text x="943.0" y="207.0" font-size="15" font-weight="400" fill="#64748B" text-anchor="middle">RGB 与 GT 同步几何变换</text>
<rect x="362" y="299" width="384" height="80" rx="13" fill="#172B4D" opacity="0.035"/>
